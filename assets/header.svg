<svg width="900" height="330" viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lord — Backend Developer, Java Ecosystem, Game Server Architect">
  <defs>
    <linearGradient id="g-lord" x1="0" y1="0" x2="380" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#BC8CFF"/>
      <stop offset="1" stop-color="#39D353"/>
      <animate attributeName="x1" values="0;200;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="380;580;380" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="g-bg" x1="0" y1="0" x2="900" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#131A24"/>
    </linearGradient>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="1" fill="#FFFFFF" opacity="0.025"/>
    </pattern>
    <clipPath id="type-cmd">
      <rect x="200" y="70" width="0" height="28">
        <animate attributeName="width" begin="0.5s" dur="0.9s" calcMode="discrete"
                 values="0;12;23;35;47;58;72" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="round">
      <rect width="900" height="330" rx="16"/>
    </clipPath>
  </defs>

  <!-- ══ background ══ -->
  <g clip-path="url(#round)">
    <rect width="900" height="330" fill="url(#g-bg)"/>
    <circle cx="795" cy="70" r="180" fill="#58A6FF" opacity="0.07"/>
    <circle cx="90" cy="310" r="160" fill="#BC8CFF" opacity="0.06"/>
    <rect width="900" height="330" fill="url(#scan)"/>
    <text x="640" y="170" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="120" font-weight="700" fill="#58A6FF" opacity="0.05">&lt;/&gt;</text>
    <text x="700" y="300" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="150" font-weight="700" fill="#BC8CFF" opacity="0.05">{ }</text>
    <rect width="900" height="44" fill="#161B22"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="329" rx="15.5" fill="none" stroke="#30363D"/>
  <line x1="0" y1="44.5" x2="900" y2="44.5" stroke="#30363D"/>

  <!-- ══ terminal window bar ══ -->
  <circle cx="26" cy="22" r="6" fill="#FF5F56"/>
  <circle cx="48" cy="22" r="6" fill="#FFBD2E"/>
  <circle cx="70" cy="22" r="6" fill="#27C93F"/>
  <text x="450" y="27" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#8B949E">lord@aesirmc — ~/production — 80×24</text>

  <g font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace">

    <!-- ══ line 1: prompt + typed command ══ -->
    <text x="36" y="90" font-size="17">
      <tspan fill="#39D353">lord@aesirmc</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#58A6FF">~</tspan><tspan fill="#8B949E">$</tspan>
    </text>
    <text x="200" y="90" font-size="17" fill="#C9D1D9" clip-path="url(#type-cmd)">whoami</text>

    <!-- ══ LORD (output) ══ -->
    <g opacity="0">
      <animate attributeName="opacity" begin="1.6s" dur="0.5s" from="0" to="1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" begin="1.6s" dur="0.5s" values="0 16;0 0" fill="freeze"/>
      <text x="32" y="188" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="84" font-weight="800" letter-spacing="6" fill="url(#g-lord)">LORD</text>
    </g>

    <!-- ══ subtitle ══ -->
    <g opacity="0">
      <animate attributeName="opacity" begin="2.2s" dur="0.6s" from="0" to="1" fill="freeze"/>
      <text x="36" y="220" font-size="15" fill="#8B949E" letter-spacing="1">BACKEND DEVELOPER <tspan fill="#484F58">//</tspan> JAVA ECOSYSTEM <tspan fill="#484F58">//</tspan> GAME SERVER ARCHITECT</text>
    </g>

    <!-- ══ systemd status lines ══ -->
    <g opacity="0">
      <animate attributeName="opacity" begin="2.8s" dur="0.5s" from="0" to="1" fill="freeze"/>
      <text x="36" y="256" font-size="14">
        <tspan fill="#8B949E">[</tspan><tspan fill="#39D353">  OK  </tspan><tspan fill="#8B949E">] backend.service — active (running) · coding since age 15</tspan>
      </text>
      <text x="36" y="280" font-size="14">
        <tspan fill="#8B949E">[</tspan><tspan fill="#39D353">  OK  </tspan><tspan fill="#8B949E">] software-engineering.edu — Aksaray University · in progress</tspan>
      </text>
    </g>

    <!-- ══ final prompt + blinking cursor ══ -->
    <g opacity="0">
      <animate attributeName="opacity" begin="3.4s" dur="0.3s" from="0" to="1" fill="freeze"/>
      <text x="36" y="314" font-size="17">
        <tspan fill="#39D353">lord@aesirmc</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#58A6FF">~</tspan><tspan fill="#8B949E">$</tspan>
      </text>
      <rect x="204" y="300" width="10" height="18" fill="#58A6FF">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

  </g>
</svg>
